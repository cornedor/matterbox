name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt + vet once, on the cheapest runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  # The default build is pure Go (no cgo), so the suite runs on both platforms
  # matterbox targets.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # The demoaudio and video code paths are compiled out of every other job, so
  # without this nothing would ever catch a break in them. Compile-only: the
  # runners have no sound card or GPU.
  optional-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install ALSA + ffmpeg headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev libswresample-dev libswscale-dev
      - name: build with every optional feature
        run: |
          make tags
          go build -tags demoaudio,video ./...
          go vet -tags demoaudio,video ./...

  # Prove the release targets still compile. Same matrix as release.yml, so a
  # tag never fails on something a PR could have caught.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null .
