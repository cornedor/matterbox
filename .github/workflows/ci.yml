name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt + vet once, on the cheapest runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  # The default build is pure Go (no cgo), so the suite runs on both platforms
  # matterbox targets.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # The demoaudio and video code paths are compiled out of every other job, so
  # without this nothing would ever catch a break in them. Compile-only: the
  # runners have no sound card or GPU.
  optional-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install ALSA + ffmpeg headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev libswresample-dev libswscale-dev
      - name: build with every optional feature
        run: |
          make tags
          go build -tags demoaudio,video ./...
          go vet -tags demoaudio,video ./...

      # Compiling the GPL path is fine — only distributing it isn't, and nothing
      # here is distributed. What this checks is that the release-time guard
      # still recognises the situation: demoaudio links gotracker/opl2
      # (GPL-2.0-or-later) through the tracker library's core packages, so the
      # licence bundler MUST refuse this build. If it ever stops refusing, opl2
      # left the dependency graph and the Apache-2.0 caveat in the README (plus
      # this check) can go.
      - name: the audio build must still be rejected by the licence guard
        run: |
          if TAGS=demoaudio,video scripts/third-party-licenses \
              >/dev/null 2>/tmp/guard-err.txt; then
            echo "the GPL guard accepted a demoaudio build — it should have refused."
            echo "if gotracker/opl2 is gone, remove this check and the README caveat."
            exit 1
          fi
          if ! grep -q 'github.com/gotracker/opl2' /tmp/guard-err.txt; then
            echo "the guard refused, but not because of opl2:"
            cat /tmp/guard-err.txt
            exit 1
          fi
          echo "ok: the licence guard rejects the demoaudio build, naming opl2"

  # Prove the release targets still compile. Same matrix as release.yml, so a
  # tag never fails on something a PR could have caught.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null .
          # release.yml does more than compile: it bundles the licences of every
          # module linked into the binary, and that step can fail (a dependency
          # arriving without a licence file, GPL code entering the default
          # build). Run it here too, tag-free like the release, so a tag never
          # fails on something a PR could have caught.
          scripts/third-party-licenses > /dev/null
