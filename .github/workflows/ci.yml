name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt + vet once, on the cheapest runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  # The default build is pure Go (no cgo), so the suite runs on both platforms
  # matterbox targets.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # The demoaudio code path is compiled out of every other job, so without this
  # nothing would ever catch a break in it. Compile-only: the runners have no
  # sound card.
  demoaudio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - name: build with the demoaudio tag
        run: |
          make tags
          go build -tags demoaudio ./...
          go vet -tags demoaudio ./...

      # demoaudio links gotracker/opl2 (GPL-2.0-or-later) through the tracker
      # library's core packages. Under matterbox's own GPL-3.0-or-later that is
      # compatible — an "or later" grant upgrades to v3 — so the licence bundler
      # must ACCEPT this build, reproduce opl2's licence in the bundle, and say
      # on stderr that the binary has to go out under the GPL. It refused this
      # build while matterbox was Apache-2.0; this check is what would catch the
      # guard drifting back. demoaudio alone, deliberately: add video and the
      # guard also has to reach a linked ffmpeg, which is the video job's check,
      # not this one.
      - name: the audio build must pass the licence guard, naming opl2
        run: |
          if ! TAGS=demoaudio scripts/third-party-licenses \
              >/tmp/bundle.txt 2>/tmp/guard-err.txt; then
            echo "the licence guard refused a demoaudio build — it should accept it:"
            cat /tmp/guard-err.txt
            exit 1
          fi
          if ! grep -q 'github.com/gotracker/opl2' /tmp/guard-err.txt; then
            echo "the guard accepted the build without reporting opl2 as GPL:"
            cat /tmp/guard-err.txt
            exit 1
          fi
          if ! grep -q 'github.com/gotracker/opl2' /tmp/bundle.txt; then
            echo "the bundle does not reproduce opl2's licence"
            exit 1
          fi
          echo "ok: the licence guard accepts the demoaudio build, naming opl2"

  # `video` binds ffmpeg through go-astiav, and astiav tracks exactly one ffmpeg
  # release (v0.41 -> n8.0): against an older API it doesn't fail to link, it
  # fails to compile, because the C functions it names don't exist yet. No apt
  # repo has ffmpeg 8 — noble ships 6.1 — so build it once and cache it, the way
  # astiav's own CI does. A cache hit makes this job as cheap as the others.
  video:
    runs-on: ubuntu-latest
    env:
      # The version astiav declares compatibility with. Bump both together.
      FFMPEG_VERSION: n8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both are needed on a cache hit too, so they cannot live in the build
      # step below: cgo finds the restored libs through pkg-config and `make
      # tags` decides with it, and the restored libavcodec.so is linked against
      # libdav1d.so — without it here, loading the library fails outright.
      - name: install pkg-config and libdav1d
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdav1d-dev

      - name: restore the ffmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-dav1d-${{ runner.os }}-${{ runner.arch }}

      # Shared libraries, so cgo's plain `pkg-config --libs` is enough (a static
      # ffmpeg needs its Libs.private, which cgo never asks for). Default codec
      # set: the video tests decode a real h264/mp4 clip, and a stripped ffmpeg
      # would make this job pass on something no user runs. No programs, docs or
      # debug info — nothing here invokes ffmpeg(1), and it keeps the cache small.
      #
      # libdav1d is not optional for the tests: ffmpeg's own "av1" decoder only
      # drives hardware, so on a runner with no accelerator every .avif comes
      # back ENOSYS and the AVIF tests fail. Every distribution's ffmpeg has
      # dav1d, so a build without it is also not the thing users have.
      - name: build ffmpeg ${{ env.FFMPEG_VERSION }}
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
          git clone --depth 1 --branch "$FFMPEG_VERSION" \
            https://github.com/FFmpeg/FFmpeg "$RUNNER_TEMP/ffmpeg-src"
          cd "$RUNNER_TEMP/ffmpeg-src"
          ./configure --prefix="$HOME/ffmpeg" \
            --enable-shared --disable-static \
            --enable-libdav1d \
            --disable-programs --disable-doc --disable-debug
          make -j"$(nproc)"
          make install

      - name: point pkg-config and the linker at it
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/ffmpeg/lib" >> "$GITHUB_ENV"

      # `make tags` has to agree that this machine can do video: it enforces the
      # same 8.0 floor, so if it says no here, the detection and the build we
      # just made have drifted apart.
      - name: build and test with the video tag
        run: |
          # `make tags` explains itself on stderr, so redirect before grepping.
          make tags 2>&1 | tee /tmp/tags.txt
          grep -q '^video:     yes' /tmp/tags.txt \
            || { echo "detection rejected the ffmpeg we just built"; exit 1; }
          go build -tags video ./...
          go vet -tags video ./...
          go test -tags video ./...

      # The only job where the decoder exists, so also the only place the licence
      # classifier meets a real libav. We configure ffmpeg above without
      # --enable-gpl or --enable-nonfree, so lgpl is the one right answer; change
      # the configure and this expectation changes with it.
      - name: the ffmpeg licence probe must classify this build as LGPL
        run: |
          go run -tags video ./internal/libav/probe | tee /tmp/libav.txt
          grep -qE '^linked=1$' /tmp/libav.txt \
            || { echo "probe did not report a linked libav"; exit 1; }
          grep -qE '^class=lgpl$' /tmp/libav.txt \
            || { echo "probe did not classify our LGPL ffmpeg as lgpl"; exit 1; }
          echo "ok: the probe classified the ffmpeg we built"

      # The other half of the same question, and the one release.yml would ask:
      # the guard must accept this build *and* carry FFmpeg's notice into the
      # bundle. Both LGPL and GPL ffmpeg pass now, so this no longer tests the
      # accept/refuse decision (only --enable-nonfree is refused, and we have no
      # such build to test with) — what it still proves is that the bundle is
      # complete. Nothing exercises this path anywhere else: without an ffmpeg
      # to link, the guard can't even run the probe.
      - name: a video build against an LGPL ffmpeg must pass the licence guard
        run: |
          TAGS=video scripts/third-party-licenses > /tmp/bundle.txt
          grep -q 'FFmpeg (libav\*)' /tmp/bundle.txt \
            || { echo "the bundle carries no FFmpeg notice"; exit 1; }
          echo "ok: the guard accepts the build and names FFmpeg in the bundle"

  # Prove every target still compiles as plain Go. This is no longer what the
  # release builds — that is the release-build job below, which needs cgo and a
  # native runner per target — but it stays because it is the cheapest way to
  # catch GOOS-specific breakage on all four, and because the licence bundler
  # runs here tag-free the way release.yml runs it tagged.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null .
          # release.yml does more than compile: it bundles the licences of every
          # module linked into the binary, and that step can fail (a dependency
          # arriving without a licence file, an incompatible licence entering
          # build). Run it here too, tag-free like the release, so a tag never
          # fails on something a PR could have caught.
          scripts/third-party-licenses > /dev/null

  # release.yml links a static FFmpeg into the binary with cgo, on a native
  # runner per target. None of that is exercised by any job above, so without
  # this a tag would be the first time it ran — and a tag that fails is a
  # release nobody gets. All four targets, though only the operating system
  # changes how the binary links (fully static vs system libraries): the ffmpeg
  # cache key is per runner, so a runner missing here has no cached build on
  # main, and a tag cannot borrow the one its own last release saved.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, runner: ubuntu-latest }
          - { goos: linux, runner: ubuntu-24.04-arm }
          - { goos: darwin, runner: macos-15-intel }
          - { goos: darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/.ffmpeg-static
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install the build tools
        run: |
          if [ "${{ matrix.goos }}" = linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nasm cmake pkg-config meson ninja-build
          else
            command -v nasm >/dev/null || brew install nasm
            command -v cmake >/dev/null || brew install cmake
            command -v meson >/dev/null || brew install meson
            command -v ninja >/dev/null || brew install ninja
            command -v pkg-config >/dev/null || brew install pkgconf
          fi

      # Same cache key as release.yml, so a tag starts from a build a PR already
      # paid for. Only main's copy is reachable: a cache written by a tag run is
      # scoped to that tag's ref, and no later tag — or main — can read it.
      - name: restore the static ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_PREFIX }}
          key: ffmpeg-static-n8.0-dav1d-1.5.1-libjxl-v0.11.1-${{ matrix.runner }}

      - name: build the static ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/ffmpeg-static "$FFMPEG_PREFIX"

      - name: build the way a release does
        env:
          CGO_ENABLED: "1"
          PKG_CONFIG: ${{ github.workspace }}/scripts/pkg-config-static
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.ffmpeg-static/lib/pkgconfig
        run: |
          tags=video
          ldflags="-s -w"
          if [ "${{ matrix.goos }}" = linux ]; then
            tags="$tags,netgo,osusergo"
            ldflags="$ldflags -extldflags -static"
          fi
          go build -trimpath -tags "$tags" -ldflags "$ldflags" -o matterbox .

      - name: the binary must carry ffmpeg, not need it
        run: |
          ./matterbox --version
          v=$(./matterbox --version)
          echo "$v" | grep -q '^ffmpeg:' || { echo "no ffmpeg linked in"; exit 1; }
          echo "$v" | grep -q 'jxl' || { echo "libjxl did not make it into ffmpeg"; exit 1; }
          if [ "${{ matrix.goos }}" = linux ]; then
            ldd matterbox 2>&1 | grep -q 'not a dynamic executable' || {
              echo "the linux binary is not static:"; ldd matterbox; exit 1; }
          else
            if otool -L matterbox | grep -qE 'libav|libsw|libjxl'; then
              echo "the binary links ffmpeg dynamically:"; otool -L matterbox; exit 1
            fi
          fi

      # The decoder is only real in this job, so this is the only place the
      # video tests run against the FFmpeg a user will actually get.
      - name: test against the ffmpeg the release ships
        env:
          CGO_ENABLED: "1"
          PKG_CONFIG: ${{ github.workspace }}/scripts/pkg-config-static
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.ffmpeg-static/lib/pkgconfig
        run: go test -tags video ./internal/ui/ ./internal/libav/

      - name: the licence bundle must cover the tagged build
        env:
          CGO_ENABLED: "1"
          PKG_CONFIG: ${{ github.workspace }}/scripts/pkg-config-static
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.ffmpeg-static/lib/pkgconfig
        run: |
          TAGS=video scripts/third-party-licenses > /tmp/bundle.txt
          grep -q 'FFmpeg (libav\*)' /tmp/bundle.txt \
            || { echo "the bundle carries no FFmpeg notice"; exit 1; }
