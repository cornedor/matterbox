name: Release

# Tag a release and this publishes prebuilt binaries for it, so installing
# doesn't require a Go toolchain:
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# The binaries are pure Go (CGO_ENABLED=0), so they run anywhere on their
# platform — but they carry neither optional feature (the --demo soundtrack
# and inline video need ALSA/ffmpeg at build time). Those still want
# `make install` from source; `matterbox version` prints which tags a binary
# was built with.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/pkg
          go build -trimpath \
            -ldflags "-s -w -X matterbox/internal/cli.version=${VERSION}" \
            -o dist/pkg/matterbox .
          cp README.md dist/pkg/
          [ -f LICENSE ] && cp LICENSE dist/pkg/ || true
          tar -czf "dist/matterbox_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C dist/pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: matterbox-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
              --title "$TAG" --generate-notes
          fi
